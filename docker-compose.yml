# All secrets are read from a .env file next to this file (copy .env.example to .env).
services:
  postgres-db:
    image: postgres:15-alpine
    container_name: moviejournal-db
    environment:
      POSTGRES_DB: ${DB_NAME:-moviejournal}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is not set - copy .env.example to .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set - copy .env.example to .env}
    ports:
      - "127.0.0.1:5432:5432" # only reachable from this machine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: moviejournal-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres-db
      DB_NAME: ${DB_NAME:-moviejournal}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set - copy .env.example to .env}
    depends_on:
      postgres-db:
        condition: service_healthy # wait until PostgreSQL accepts connections

volumes:
  postgres_data:
