spring.application.name=moviejournal

# Database - credentials come from environment variables (see .env.example)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:moviejournal}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=always

# JWT - the secret must be at least 32 bytes (256 bits) for HMAC-SHA256
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
